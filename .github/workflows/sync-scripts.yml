name: Sync scripts from Google Docs

on:
  schedule:
    # Daily at 05:17 UTC. GitHub disables scheduled workflows after 60 days
    # of repository inactivity; rerun this manually to re-enable it.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Sync a single script by its registry name (blank = all)'
        required: false
        type: string
      force:
        description: 'Bypass the line-count shrink guard'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-scripts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync scripts from Google Docs
        id: sync
        run: |
          node scripts/sync-scripts.mjs \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Verify the app still builds
        if: steps.sync.outputs.changed_count != '0'
        run: npm run build

      - name: Set aside the synced files
        if: steps.sync.outputs.changed_count != '0'
        run: |
          mkdir -p "$RUNNER_TEMP/synced"
          cp public/scripts/* "$RUNNER_TEMP/synced/"
          git checkout -- public/scripts

      - name: Open a pull request per changed script
        if: steps.sync.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.sync.outputs.changed }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Passing the payload through the environment avoids any quoting or
          # injection problems with titles and actor names.
          printf '%s' "$CHANGED" > "$RUNNER_TEMP/changed.json"

          gh label create script-sync \
            --color 0E8A16 \
            --description 'Automated sync from the source Google Doc' \
            >/dev/null 2>&1 || true

          count=$(jq 'length' "$RUNNER_TEMP/changed.json")
          failed=()

          for i in $(seq 0 $((count - 1))); do
            name=$(jq -r ".[$i].name"      "$RUNNER_TEMP/changed.json")
            title=$(jq -r ".[$i].title"    "$RUNNER_TEMP/changed.json")
            md=$(jq -r ".[$i].md"          "$RUNNER_TEMP/changed.json")
            json=$(jq -r ".[$i].json"      "$RUNNER_TEMP/changed.json")
            source=$(jq -r ".[$i].sourceUrl" "$RUNNER_TEMP/changed.json")
            summary=$(jq -r ".[$i].summary"  "$RUNNER_TEMP/changed.json")

            branch="chore/sync-script/$name"
            echo "::group::$name"

            # Always rebuild the branch from the base so a stale open PR picks
            # up any commits merged since it was opened.
            git checkout -B "$branch" "origin/$BASE"
            cp "$RUNNER_TEMP/synced/$(basename "$md")"   "public$md"
            cp "$RUNNER_TEMP/synced/$(basename "$json")" "public$json"
            git add "public$md" "public$json"

            if git diff --cached --quiet; then
              echo "No net change against $BASE, skipping."
              git checkout -- . && echo '::endgroup::' && continue
            fi

            git commit -m "Sync \"$title\" from the source Google Doc" \
                       -m "$summary" \
                       -m "Generated by $RUN_URL"
            git push --force origin "$branch"

            {
              echo "Automated sync of **$title** from its source Google Doc."
              echo
              if [ -n "$source" ]; then
                echo "[Open the source document]($source)"
                echo
              fi
              jq -r ".[$i].body" "$RUNNER_TEMP/changed.json"
              echo
              echo "Review the \`.md\` diff; the \`.json\` is generated from it by \`parse_regexp.js\`."
              echo
              echo "_Opened by [this workflow run]($RUN_URL). Merge manually once the changes look right._"
            } > "$RUNNER_TEMP/body.md"

            # The branch is already pushed, so a failure here loses nothing but
            # the pull request itself. Record it and carry on: letting one
            # script abort the step used to leave the rest unsynced entirely.
            if gh pr view "$branch" --json number --jq .number >/dev/null 2>&1; then
              if gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"; then
                echo "Updated $(gh pr view "$branch" --json url --jq .url)"
              else
                failed+=("$name")
              fi
            elif ! gh pr create \
                --base "$BASE" \
                --head "$branch" \
                --title "Sync \"$title\" from the source Google Doc" \
                --body-file "$RUNNER_TEMP/body.md" \
                --label script-sync; then
              failed+=("$name")
              echo "Branch is pushed; open it by hand at:"
              echo "  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?expand=1"
            fi

            echo '::endgroup::'
          done

          git checkout "$BASE"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Pushed the branches but could not open pull requests for: ${failed[*]}"
            echo "If the log above says GitHub Actions is not permitted to create pull"
            echo "requests, tick Settings > Actions > General > Workflow permissions >"
            echo "'Allow GitHub Actions to create and approve pull requests'. An"
            echo "organisation policy can override the repository setting."
            exit 1
          fi
